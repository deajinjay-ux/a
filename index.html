<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avatar Studio Pro | Professional Character Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --panel-bg: rgba(255, 255, 255, 0.9);
            --panel-backdrop: blur(20px);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --accent-color: #0ea5e9;
            --accent-hover: #0284c7;
            --accent-soft: #e0f2fe;
            --border-color: #e2e8f0;
            --header-bg: rgba(255, 255, 255, 0.95);
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --radius-lg: 1rem;
            --radius-md: 0.75rem;
            --radius-sm: 0.5rem;
        }

        body.dark-mode {
            --bg-color: #020617;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #082f49 100%);
            --panel-bg: rgba(15, 23, 42, 0.85);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-tertiary: #64748b;
            --accent-color: #38bdf8;
            --accent-hover: #7dd3fc;
            --accent-soft: rgba(56, 189, 248, 0.15);
            --border-color: rgba(255,255,255,0.1);
            --header-bg: rgba(2, 6, 23, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Header */
        .app-header {
            height: 56px;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
        }

        .logo-area i {
            color: var(--accent-color);
            width: 22px;
            height: 22px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Layout */
        .app-container {
            display: flex;
            height: calc(100vh - 56px);
            margin-top: 56px;
        }

        /* Preview Area */
        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            max-width: 450px;
            max-height: 80dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.1));
        }

        svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Controls Panel */
        .controls-panel {
            flex: 0 0 400px;
            background-color: var(--panel-bg);
            backdrop-filter: var(--panel-backdrop);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
            z-index: 10;
            box-shadow: -10px 0 30px rgba(0,0,0,0.02);
        }

        .panel-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            padding: 0 0.5rem;
            background: var(--header-bg);
        }

        .tab-btn {
            flex: 1;
            padding: 1.1rem 0.25rem;
            border: none;
            background: none;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-tertiary);
            cursor: pointer;
            position: relative;
            font-family: inherit;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--accent-color);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            right: 20%;
            height: 3px;
            border-radius: 3px 3px 0 0;
            background: var(--accent-color);
        }

        .controls-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .control-group {
            margin-bottom: 1.75rem;
        }

        .control-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 800;
            color: var(--text-tertiary);
            margin-bottom: 0.75rem;
            letter-spacing: 0.05em;
        }

        /* Style Buttons */
        .style-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 0.75rem;
        }

        .style-btn {
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.75rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .style-btn:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .style-btn.active {
            background: var(--accent-soft);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Color Options */
        .color-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .color-swatch {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            border: 3px solid var(--panel-bg);
            box-shadow: 0 0 0 1px var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .color-swatch.active {
            transform: scale(1.1);
            box-shadow: 0 0 0 2px var(--accent-color);
        }

        .custom-color-btn {
            width: 100%;
            padding: 0.75rem;
            border: 2px dashed var(--border-color);
            background: transparent;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        /* Header Buttons */
        .btn-header {
            padding: 0.5rem 0.75rem;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid transparent;
            transition: all 0.2s;
            background: transparent;
            color: var(--text-secondary);
        }

        .btn-header.download {
            background: var(--accent-color);
            color: white;
        }

        .btn-header.download.secondary {
            background: transparent;
            color: var(--accent-color);
            border: 1.5px solid var(--accent-color);
        }

        @media (max-width: 850px) {
            .app-header { height: 52px; padding: 0 0.75rem; }
            .logo-text { font-size: 0.95rem; }
            .app-container {
                flex-direction: column;
                height: calc(100dvh - 52px);
                margin-top: 52px;
            }
            .preview-area {
                flex: 0 0 32vh; /* Reduced height to fix scaling */
                padding: 0.75rem;
            }
            .canvas-container {
                max-width: 240px;
            }
            .controls-panel {
                flex: 1;
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--border-color);
                border-radius: 1.5rem 1.5rem 0 0;
                overflow: hidden;
            }
            .controls-scroll {
                padding: 1.25rem 1rem 100px 1rem;
            }
            .style-options {
                grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            }
            .hide-mobile { display: none; }
        }

        /* Avatar SVG Logic Classes */
        .svg-skin { fill: var(--skin-color, #F5CBA7); transition: fill 0.3s; }
        .svg-skin-dark { fill: var(--skin-dark, #E0AC69); transition: fill 0.3s; }
        .svg-hair { fill: var(--hair-color, #6b4c3a); transition: fill 0.3s; }
        .svg-hair-dark { fill: var(--hair-dark, #4a3325); transition: fill 0.3s; }
        .svg-top { fill: var(--top-color, #4a90e2); transition: fill 0.3s; }
        .svg-top-dark { fill: var(--top-dark, #357abd); transition: fill 0.3s; }
        .svg-bottom { fill: var(--bottom-color, #333333); transition: fill 0.3s; }
        .svg-bottom-dark { fill: var(--bottom-dark, #1a1a1a); transition: fill 0.3s; }
        .svg-outline { stroke: #3f2a24; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
        .svg-outline-thin { stroke: #3f2a24; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .svg-white { fill: #ffffff; }

        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
        @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
        #full-body { animation: float 4s ease-in-out infinite; transform-origin: center bottom; }
        #full-body.shake { animation: shake 0.5s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        #eyes-group { transform-origin: 150px 155px; animation: blink 5s infinite; }
        .hidden-picker { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="logo-area">
            <i data-lucide="sparkles"></i>
            <span class="logo-text">Avatar Studio</span>

        <div class="header-actions">
            <button id="lang-toggle" class="btn-header">

            <button id="theme-toggle" class="btn-header">
                <i data-lucide="moon" class="moon-icon"></i>
                <i data-lucide="sun" class="sun-icon" style="display:none;"></i>
            </button>
            <button class="btn-header random">
                <i data-lucide="shuffle"></i>
                <span class="hide-mobile" data-i18n="random">랜덤</span>
            </button>
            <button id="download-svg-btn" class="btn-header download secondary">

            <button id="download-png-btn" class="btn-header download">

        <aside class="controls-panel">
            <nav class="panel-tabs">
                <button class="tab-btn active" data-tab="style" data-i18n="tabStyle">성별 & 얼굴</button>
                <button class="tab-btn" data-tab="hair" data-i18n="tabHair">헤어</button>
                <button class="tab-btn" data-tab="clothes" data-i18n="tabClothes">의상</button>
                <button class="tab-btn" data-tab="color" data-i18n="tabColor">색상</button>
            </nav>

            <div class="controls-scroll">
                <div id="style-content" class="tab-content active">
                    <div class="control-group">
                        <label data-i18n="genderLabel">성별</label>
                        <div class="style-options" data-type="gender">
                            <button class="style-btn active" data-id="m"><i data-lucide="user"></i> <span data-i18n="boy">소년</span></button>
                            <button class="style-btn" data-id="f"><i data-lucide="user-round"></i> <span data-i18n="girl">소녀</span></button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label data-i18n="eyeLabel">눈 모양</label>
                        <div class="style-options" data-type="eye">
                            <button class="style-btn active" data-id="1"><i data-lucide="eye"></i> <span data-i18n="eye1">기본</span></button>
                            <button class="style-btn" data-id="2"><i data-lucide="smile"></i> <span data-i18n="eye2">웃음</span></button>
                            <button class="style-btn" data-id="3"><i data-lucide="circle"></i> <span data-i18n="eye3">도트</span></button>
                            <button class="style-btn" data-id="4"><i data-lucide="squint"></i> <span data-i18n="eye4">장난</span></button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label data-i18n="mouthLabel">입 모양</label>
                        <div class="style-options" data-type="mouth">
                            <button class="style-btn active" data-id="1"><i data-lucide="smile"></i> <span data-i18n="mouth1">미소</span></button>
                            <button class="style-btn" data-id="2"><i data-lucide="laugh"></i> <span data-i18n="mouth2">활짝</span></button>
                            <button class="style-btn" data-id="3"><i data-lucide="cat"></i> <span data-i18n="mouth3">고양이</span></button>

                        </div>
                    </div>
                </div>

                <div id="hair-content" class="tab-content">
                    <div class="control-group">
                        <label data-i18n="hairLabel">헤어 스타일</label>
                        <div class="style-options" data-type="hair" id="hair-options-container"></div>
                    </div>
                </div>

                <div id="clothes-content" class="tab-content">
                    <div class="control-group">
                        <label data-i18n="topLabel">상의</label>
                        <div class="style-options" data-type="top">
                            <button class="style-btn active" data-id="1"><i data-lucide="shirt"></i> <span data-i18n="top1">반팔티</span></button>
                            <button class="style-btn" data-id="2"><i data-lucide="user"></i> <span data-i18n="top2">후드티</span></button>
                            <button class="style-btn" data-id="3"><i data-lucide="briefcase"></i> <span data-i18n="top3">조끼</span></button>
                            <button class="style-btn" data-id="4"><i data-lucide="align-justify"></i> <span data-i18n="top4">스트라이프</span></button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label data-i18n="bottomLabel">하의</label>
                        <div class="style-options" data-type="bottom">
                            <button class="style-btn active" data-id="1"><i data-lucide="columns"></i> <span data-i18n="bottom1">반바지</span></button>
                            <button class="style-btn" data-id="2"><i data-lucide="align-center"></i> <span data-i18n="bottom2">긴바지</span></button>
                            <button class="style-btn" data-id="3"><i data-lucide="layers"></i> <span data-i18n="bottom3">치마</span></button>
                        </div>
                    </div>
                </div>

                <div id="color-content" class="tab-content">
                    <div class="control-group">
                        <label data-i18n="skinLabel">피부색</label>
                        <div class="color-options" id="color-skin"></div>
                        <input type="color" id="picker-skin" class="hidden-picker">
                        <button class="custom-color-btn" onclick="document.getElementById('picker-skin').click()"><i data-lucide="pipette"></i> <span data-i18n="customColor">직접 선택</span></button>
                    </div>
                    <div class="control-group">
                        <label data-i18n="hairColorLabel">머리색</label>
                        <div class="color-options" id="color-hair"></div>
                        <input type="color" id="picker-hair" class="hidden-picker">
                        <button class="custom-color-btn" onclick="document.getElementById('picker-hair').click()"><i data-lucide="pipette"></i> <span data-i18n="customColor">직접 선택</span></button>
                    </div>
                    <div class="control-group">
                        <label data-i18n="topColorLabel">상의색</label>
                        <div class="color-options" id="color-top"></div>
                        <input type="color" id="picker-top" class="hidden-picker">
                        <button class="custom-color-btn" onclick="document.getElementById('picker-top').click()"><i data-lucide="pipette"></i> <span data-i18n="customColor">직접 선택</span></button>
                    </div>
                    <div class="control-group">
                        <label data-i18n="bottomColorLabel">하의색</label>
                        <div class="color-options" id="color-bottom"></div>
                        <input type="color" id="picker-bottom" class="hidden-picker">
                        <button class="custom-color-btn" onclick="document.getElementById('picker-bottom').click()"><i data-lucide="pipette"></i> <span data-i18n="customColor">직접 선택</span></button>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            const i18n = {
                ko: {
                    random: "랜덤", tabStyle: "성별 & 얼굴", tabHair: "헤어", tabClothes: "의상", tabColor: "색상",
                    genderLabel: "성별", boy: "소년", girl: "소녀",
                    eyeLabel: "눈 모양", eye1: "기본", eye2: "웃음", eye3: "도트", eye4: "장난",
                    mouthLabel: "입 모양", mouth1: "미소", mouth2: "활짝", mouth3: "고양이", mouth4: "놀람",
                    hairLabel: "헤어 스타일", hairM1: "더벅머리", hairM2: "댄디컷", hairM3: "스포츠", hairF1: "긴머리", hairF2: "포니테일", hairF3: "단발",
                    topLabel: "상의", top1: "반팔티", top2: "후드티", top3: "조끼", top4: "스트라이프",
                    bottomLabel: "하의", bottom1: "반바지", bottom2: "긴바지", bottom3: "치마",
                    skinLabel: "피부색", hairColorLabel: "머리색", topColorLabel: "상의색", bottomColorLabel: "하의색", customColor: "직접 선택"
                },
                en: {
                    random: "Random", tabStyle: "Face", tabHair: "Hair", tabClothes: "Clothes", tabColor: "Colors",
                    genderLabel: "Gender", boy: "Boy", girl: "Girl",
                    eyeLabel: "Eyes", eye1: "Basic", eye2: "Smile", eye3: "Dot", eye4: "Squint",
                    mouthLabel: "Mouth", mouth1: "Smile", mouth2: "Laugh", mouth3: "Cat", mouth4: "Surprise",
                    hairLabel: "Hair Style", hairM1: "Spiky", hairM2: "Dandy", hairM3: "Short", hairF1: "Long", hairF2: "Ponytail", hairF3: "Bob",
                    topLabel: "Top", top1: "T-Shirt", top2: "Hoodie", top3: "Vest", top4: "Stripe",
                    bottomLabel: "Bottom", bottom1: "Shorts", bottom2: "Pants", bottom3: "Skirt",
                    skinLabel: "Skin", hairColorLabel: "Hair", topColorLabel: "Top Color", bottomColorLabel: "Bottom Color", customColor: "Custom"
                }
            };

            let currentLang = localStorage.getItem('lang') || 'ko';
            const state = {
                gender: 'm', eye: 1, mouth: 1, hair: 1, top: 1, bottom: 1,
                colors: { skin: '#FFE0C2', hair: '#6C4A35', top: '#4a90e2', bottom: '#334155' }
            };

            const palettes = {
                skin: ['#FFF0E6', '#FFE0C2', '#F5CBA7', '#E0AC69', '#C68642', '#8D5524'],
                hair: ['#6C4A35', '#2d3436', '#b2bec3', '#d63031', '#fdcb6e', '#0984e3', '#6c5ce7', '#e84393'],
                top: ['#4a90e2', '#e74c3c', '#2ecc71', '#f1c40f', '#9b59b6', '#34495e', '#ecf0f1', '#e67e22'],
                bottom: ['#334155', '#1e293b', '#64748b', '#f8fafc', '#0f172a', '#b91c1c', '#047857', '#1d4ed8']
            };

            const hairOptions = {
                m: [{ id: 1, i18nKey: 'hairM1', icon: 'zap' }, { id: 2, i18nKey: 'hairM2', icon: 'scissors' }, { id: 3, i18nKey: 'hairM3', icon: 'circle-dashed' }],
                f: [{ id: 1, i18nKey: 'hairF1', icon: 'arrow-down' }, { id: 2, i18nKey: 'hairF2', icon: 'star' }, { id: 3, i18nKey: 'hairF3', icon: 'scissors' }]
            };

            function updateLanguage(lang) {
                currentLang = lang; localStorage.setItem('lang', lang); document.documentElement.lang = lang;
                document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.dataset.i18n; if (i18n[lang][key]) el.textContent = i18n[lang][key]; });
                document.getElementById('lang-text').textContent = lang === 'ko' ? 'EN' : 'KO';
                renderHairOptions();
            }

            document.getElementById('lang-toggle').addEventListener('click', () => updateLanguage(currentLang === 'ko' ? 'en' : 'ko'));

            document.getElementById('theme-toggle').addEventListener('click', () => {
                const isDark = document.body.classList.toggle('dark-mode');
                document.querySelector('.moon-icon').style.display = isDark ? 'none' : 'block';
                document.querySelector('.sun-icon').style.display = isDark ? 'block' : 'none';
            });

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn, .tab-content').forEach(el => el.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(`${btn.dataset.tab}-content`).classList.add('active');
                });
            });

            function updateAvatar() {
                const svg = document.getElementById('avatar-svg');
                const toggleParts = (prefix, currentId, allowGender = false) => {
                    svg.querySelectorAll(`.part-${prefix}`).forEach(el => el.style.display = 'none');
                    const targetClass = allowGender ? `.part-${prefix}-${state.gender}-${currentId}` : `.part-${prefix}-${currentId}`;
                    svg.querySelectorAll(targetClass).forEach(el => el.style.display = 'block');
                };
                toggleParts('eye', state.eye); toggleParts('mouth', state.mouth); toggleParts('top', state.top); toggleParts('bottom', state.bottom); toggleParts('hair', state.hair, true);

                const shade = (col, amt) => {
                    let usePound = false; if (col[0] == "#") { col = col.slice(1); usePound = true; }
                    let num = parseInt(col, 16);
                    let r = (num >> 16) + amt; if (r > 255) r = 255; else if (r < 0) r = 0;
                    let b = ((num >> 8) & 0x00FF) + amt; if (b > 255) b = 255; else if (b < 0) b = 0;
                    let g = (num & 0x0000FF) + amt; if (g > 255) g = 255; else if (g < 0) g = 0;
                    return (usePound ? "#" : "") + (g | (b << 8) | (r << 16)).toString(16).padStart(6, '0');
                };

                svg.style.setProperty('--skin-color', state.colors.skin);
                svg.style.setProperty('--skin-dark', shade(state.colors.skin, -30));
                svg.style.setProperty('--hair-color', state.colors.hair);
                svg.style.setProperty('--hair-dark', shade(state.colors.hair, -40));
                svg.style.setProperty('--top-color', state.colors.top);
                svg.style.setProperty('--top-dark', shade(state.colors.top, -40));
                svg.style.setProperty('--bottom-color', state.colors.bottom);
                svg.style.setProperty('--bottom-dark', shade(state.colors.bottom, -30));
                syncActiveButtons();
            }

            function renderHairOptions() {
                const container = document.getElementById('hair-options-container'); if (!container) return;
                container.innerHTML = '';
                hairOptions[state.gender].forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = `style-btn ${state.hair === opt.id ? 'active' : ''}`;
                    btn.innerHTML = `<i data-lucide="${opt.icon}"></i> <span>${i18n[currentLang][opt.i18nKey]}</span>`;
                    btn.onclick = () => { state.hair = opt.id; updateAvatar(); triggerShake(); };
                    container.appendChild(btn);
                });
                lucide.createIcons();
            }

            document.querySelectorAll('.style-options[data-type]').forEach(group => {
                const type = group.dataset.type; if (type === 'hair') return;
                group.querySelectorAll('.style-btn').forEach(btn => {
                    btn.onclick = () => {
                        const id = btn.dataset.id;
                        if (type === 'gender') { if (state.gender !== id) { state.gender = id; state.hair = 1; renderHairOptions(); } }
                        else state[type] = parseInt(id) || id;
                        updateAvatar(); triggerShake();
                    };
                });
            });

            ['skin', 'hair', 'top', 'bottom'].forEach(part => {
                const cont = document.getElementById(`color-${part}`);
                const picker = document.getElementById(`picker-${part}`);
                palettes[part].forEach(color => {
                    const swatch = document.createElement('div'); swatch.className = 'color-swatch'; swatch.style.backgroundColor = color;
                    swatch.onclick = () => {
                        state.colors[part] = color; picker.value = color; updateAvatar();
                        cont.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active')); swatch.classList.add('active');
                    };
                    cont.appendChild(swatch);
                });
                picker.oninput = e => { state.colors[part] = e.target.value; updateAvatar(); cont.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active')); };
            });

            function syncActiveButtons() {
                ['gender', 'eye', 'mouth', 'top', 'bottom'].forEach(type => {
                    const group = document.querySelector(`.style-options[data-type="${type}"]`);
                    if (group) group.querySelectorAll('.style-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.id == state[type]));
                });
            }

            function triggerShake() {
                const body = document.getElementById('full-body'); body.classList.remove('shake'); void body.offsetWidth; body.classList.add('shake');
            }

            document.querySelector('.random').onclick = () => {
                state.gender = Math.random() > 0.5 ? 'm' : 'f'; state.eye = Math.floor(Math.random() * 4) + 1; state.mouth = Math.floor(Math.random() * 4) + 1;
                state.hair = Math.floor(Math.random() * 3) + 1; state.top = Math.floor(Math.random() * 4) + 1; state.bottom = Math.floor(Math.random() * 3) + 1;
                ['skin', 'hair', 'top', 'bottom'].forEach(part => { state.colors[part] = palettes[part][Math.floor(Math.random() * palettes[part].length)]; document.getElementById(`picker-${part}`).value = state.colors[part]; });
                renderHairOptions(); updateAvatar(); triggerShake();
            };

            const triggerDownload = (url, filename) => { const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); };

            document.getElementById('download-svg-btn').onclick = () => {
                const svg = document.getElementById('avatar-svg').cloneNode(true);
                const content = svg.innerHTML.replace(/var\(--skin-color, [^)]+\)/g, state.colors.skin).replace(/var\(--hair-color, [^)]+\)/g, state.colors.hair).replace(/var\(--top-color, [^)]+\)/g, state.colors.top).replace(/var\(--bottom-color, [^)]+\)/g, state.colors.bottom);
                svg.innerHTML = content;
                let src = new XMLSerializer().serializeToString(svg); if (!src.match(/^<\?xml/)) src = '<?xml version="1.0" standalone="no"?>\r\n' + src;
                triggerDownload(URL.createObjectURL(new Blob([src], { type: 'image/svg+xml;charset=utf-8' })), 'avatar.svg');
            };

            document.getElementById('download-png-btn').onclick = () => {
                const svg = document.getElementById('avatar-svg');
                const src = new XMLSerializer().serializeToString(svg);
                const canvas = document.createElement('canvas'); canvas.width = 1200; canvas.height = 2000;
                const ctx = canvas.getContext('2d'); const img = new Image();
                img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); triggerDownload(canvas.toDataURL('image/png'), 'avatar.png'); };
                img.src = URL.createObjectURL(new Blob([src], { type: 'image/svg+xml;charset=utf-8' }));
            };

            updateLanguage(currentLang); renderHairOptions(); updateAvatar();
        });
    </script>
</body>
</html>
