<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avatar Studio Pro | Vector Character Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #f0fdfa;
            --bg-gradient: linear-gradient(135deg, #ccfbf1 0%, #e0f2fe 100%);
            --panel-bg: rgba(255, 255, 255, 0.9);
            --panel-backdrop: blur(16px);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --accent-color: #0ea5e9;
            --accent-hover: #0284c7;
            --accent-soft: #e0f2fe;
            --border-color: #cbd5e1;
            --header-bg: rgba(255, 255, 255, 0.95);
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-lg: 1rem;
            --radius-md: 0.75rem;
            --radius-sm: 0.5rem;
        }

        body.dark-mode {
            --bg-color: #020617;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #082f49 100%);
            --panel-bg: rgba(15, 23, 42, 0.85);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-tertiary: #64748b;
            --accent-color: #38bdf8;
            --accent-hover: #7dd3fc;
            --accent-soft: rgba(56, 189, 248, 0.15);
            --border-color: rgba(255,255,255,0.1);
            --header-bg: rgba(2, 6, 23, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Header */
        .app-header {
            height: 64px;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.02em;
        }

            .logo-area i {
                color: var(--accent-color);
            }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        /* Layout */
        .app-container {
            display: flex;
            height: calc(100vh - 64px);
            margin-top: 64px;
        }

        /* Preview Area & SVG Animations */
        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

            .preview-area::before {
                content: '';
                position: absolute;
                width: 50vw;
                height: 50vw;
                max-width: 600px;
                max-height: 600px;
                background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: -1;
                opacity: 0.8;
            }

        .canvas-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 700px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.15));
        }

        svg {
            width: 100%;
            height: 100%;
            max-height: 100%;
            overflow: visible;
        }

        /* Avatar SVG Styles */
        .svg-skin {
            fill: var(--skin-color, #F5CBA7);
            transition: fill 0.3s;
        }

        .svg-skin-dark {
            fill: var(--skin-dark, #E0AC69);
            transition: fill 0.3s;
        }

        .svg-hair {
            fill: var(--hair-color, #6b4c3a);
            transition: fill 0.3s;
        }

        .svg-hair-dark {
            fill: var(--hair-dark, #4a3325);
            transition: fill 0.3s;
        }

        .svg-top {
            fill: var(--top-color, #4a90e2);
            transition: fill 0.3s;
        }

        .svg-top-dark {
            fill: var(--top-dark, #357abd);
            transition: fill 0.3s;
        }

        .svg-bottom {
            fill: var(--bottom-color, #333333);
            transition: fill 0.3s;
        }

        .svg-bottom-dark {
            fill: var(--bottom-dark, #1a1a1a);
            transition: fill 0.3s;
        }

        .svg-outline {
            stroke: #3f2a24;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .svg-outline-thin {
            stroke: #3f2a24;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .svg-white {
            fill: #ffffff;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes blink {
            0%, 92%, 100% {
                transform: scaleY(1);
            }

            96% {
                transform: scaleY(0.1);
            }
        }

        #full-body {
            animation: float 3.5s ease-in-out infinite;
            transform-origin: center bottom;
        }

            #full-body.shake {
                animation: shake 0.5s ease-in-out;
            }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0) rotate(0);
            }

            20% {
                transform: translateX(-5px) rotate(-2deg);
            }

            40% {
                transform: translateX(5px) rotate(2deg);
            }

            60% {
                transform: translateX(-5px) rotate(-2deg);
            }

            80% {
                transform: translateX(5px) rotate(2deg);
            }
        }

        #eyes-group {
            transform-origin: 150px 155px;
            animation: blink 5s infinite;
        }

        /* Controls Panel */
        .controls-panel {
            flex: 0 0 420px;
            max-width: 450px;
            background-color: var(--panel-bg);
            backdrop-filter: var(--panel-backdrop);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
            box-shadow: -4px 0 20px rgba(0,0,0,.04);
            z-index: 10;
            transition: all 0.3s ease;
        }

        .panel-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            padding: 0 0.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 1.2rem 0.5rem;
            border: none;
            background: none;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-tertiary);
            cursor: pointer;
            position: relative;
            font-family: inherit;
            transition: color 0.2s;
        }

            .tab-btn:hover {
                color: var(--text-primary);
            }

            .tab-btn.active {
                color: var(--accent-color);
            }

                .tab-btn.active::after {
                    content: '';
                    position: absolute;
                    bottom: -1px;
                    left: 15%;
                    right: 15%;
                    height: 3px;
                    border-radius: 3px 3px 0 0;
                    background: var(--accent-color);
                }

        .controls-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

            .controls-scroll::-webkit-scrollbar {
                width: 6px;
            }

            .controls-scroll::-webkit-scrollbar-thumb {
                background: var(--border-color);
                border-radius: 4px;
            }

        .control-group {
            margin-bottom: 2rem;
        }

            .control-group label {
                display: block;
                font-size: 0.75rem;
                text-transform: uppercase;
                font-weight: 800;
                color: var(--text-tertiary);
                margin-bottom: 0.8rem;
                letter-spacing: 0.05em;
            }

        /* Style Buttons */
        .style-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 0.75rem;
        }

        .style-btn {
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.8rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
            font-family: inherit;
        }

            .style-btn i {
                width: 24px;
                height: 24px;
                opacity: 0.7;
                transition: all 0.2s;
            }

            .style-btn:hover {
                border-color: var(--accent-color);
                transform: translateY(-2px);
                color: var(--text-primary);
            }

                .style-btn:hover i {
                    opacity: 1;
                    transform: scale(1.1);
                }

            .style-btn.active {
                background: var(--accent-soft);
                border-color: var(--accent-color);
                color: var(--accent-color);
            }

                .style-btn.active i {
                    opacity: 1;
                    stroke-width: 2.5px;
                }

        /* Color Swatches */
        .color-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 0.75rem;
        }

        .color-swatch {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            border: 3px solid var(--panel-bg);
            box-shadow: 0 0 0 1px var(--border-color), var(--shadow-sm);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

            .color-swatch:hover {
                transform: scale(1.15);
            }

            .color-swatch.active {
                transform: scale(1.15);
                box-shadow: 0 0 0 2px var(--panel-bg), 0 0 0 4px var(--accent-color);
                z-index: 2;
            }

        .hidden-picker {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        .custom-color-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.7rem 1rem;
            border-radius: var(--radius-sm);
            border: 2px dashed var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            transition: all 0.2s;
        }

            .custom-color-btn:hover {
                border-color: var(--accent-color);
                color: var(--accent-color);
                background: var(--accent-soft);
            }

        /* Header Buttons */
        .btn-header {
            padding: 0.5rem 0.8rem;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid transparent;
            transition: all 0.2s;
            font-family: inherit;
            background: transparent;
            color: var(--text-secondary);
        }

            .btn-header i {
                width: 18px;
                height: 18px;
            }

            .btn-header:hover {
                background: var(--bg-color);
                color: var(--text-primary);
            }

            .btn-header.download {
                background: var(--accent-color);
                color: white;
                box-shadow: var(--shadow-sm);
            }

                .btn-header.download:hover {
                    background: var(--accent-hover);
                    transform: translateY(-2px);
                    box-shadow: var(--shadow-md);
                }

                .btn-header.download.secondary {
                    background: transparent;
                    color: var(--accent-color);
                    border: 2px solid var(--accent-color);
                }

                    .btn-header.download.secondary:hover {
                        background: var(--accent-soft);
                    }

        .theme-btn {
            width: 40px;
            height: 40px;
            padding: 0;
            justify-content: center;
            border-radius: 50%;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

            .tab-content.active {
                display: block;
            }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 850px) {
            .app-header {
                height: 60px;
                padding: 0 1rem;
            }

            .app-container {
                flex-direction: column;
                height: calc(100vh - 60px);
                margin-top: 60px;
            }

            .preview-area {
                flex: 0 0 38vh;
                padding: 1rem;
            }

            .canvas-container {
                max-width: 280px;
            }

            .controls-panel {
                flex: 1;
                width: 100%;
                max-width: none;
                border-left: none;
                border-top: 1px solid var(--border-color);
                border-radius: 1.5rem 1.5rem 0 0;
            }

            .panel-tabs {
                position: sticky;
                top: 0;
                z-index: 20;
                background: var(--panel-bg);
                border-radius: 1.5rem 1.5rem 0 0;
            }

            .tab-btn {
                padding: 1rem 0.2rem;
                font-size: 0.8rem;
            }

            .controls-scroll {
                padding: 1.5rem 1rem 100px 1rem;
            }

            .hide-mobile {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="logo-area">
            <i data-lucide="sparkles"></i>
            <span class="logo-text">Avatar Studio Pro</span>
        </div>
        <div class="header-actions">
            <button id="lang-toggle" class="btn-header lang-btn">
                <i data-lucide="languages"></i> <span id="lang-text">EN</span>
            </button>
            <button id="theme-toggle" class="btn-header theme-btn">
                <i data-lucide="moon" class="moon-icon"></i>
                <i data-lucide="sun" class="sun-icon" style="display:none;"></i>
            </button>
            <button class="btn-header random">
                <i data-lucide="shuffle"></i>
                <span class="hide-mobile" data-i18n="random">랜덤</span>
            </button>
            <button class="btn-header random">
                <i data-lucide="shuffle"></i>
                <span class="hide-mobile">랜덤</span>
            </button>
            <button id="download-svg-btn" class="btn-header download secondary">
                <i data-lucide="code"></i> <span>SVG</span>
            </button>
            <button id="download-png-btn" class="btn-header download">
                <i data-lucide="image"></i> <span>PNG</span>
            </button>
        </div>
    </header>

    <div class="app-container">
        <main class="preview-area">
            <div class="canvas-container">
                <!-- SVG Vector Avatar Base -->
                <!-- viewBox를 넉넉하게 잡아 카툰풍 비율(머리 큼, 몸통 작음)을 극대화 -->
                <svg id="avatar-svg" viewBox="0 0 300 500" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
                        </filter>
                        <filter id="soft-shadow">
                            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
                        </filter>
                    </defs>

                    <g id="full-body" filter="url(#drop-shadow)">

                        <!-- 1. 뒤쪽 레이어 (뒷머리 등) -->
                        <g id="layer-back">
                            <g class="part-hair part-hair-f-1" style="display:none;">
                                <path class="svg-hair svg-outline" d="M 100 150 C 60 250, 80 350, 110 380 L 150 350 L 190 380 C 220 350, 240 250, 200 150 Z" />
                            </g>
                            <g class="part-hair part-hair-f-2" style="display:none;">
                                <path class="svg-hair svg-outline" d="M 150 120 C 240 70, 280 180, 240 280 C 210 250, 180 200, 160 160 Z" />
                            </g>
                        </g>

                        <!-- 2. 신발 -->
                        <g id="layer-shoes">
                            <g class="part-shoe">
                                <!-- 왼발 -->
                                <path class="svg-bottom-dark svg-outline" d="M 110 435 C 105 450, 140 455, 145 440 L 135 425 L 115 425 Z" />
                                <path class="svg-white svg-outline" d="M 107 445 C 105 455, 142 460, 145 448 L 140 440 L 110 440 Z" />
                                <!-- 오른발 -->
                                <path class="svg-bottom-dark svg-outline" d="M 190 435 C 195 450, 160 455, 155 440 L 165 425 L 185 425 Z" />
                                <path class="svg-white svg-outline" d="M 193 445 C 195 455, 158 460, 155 448 L 160 440 L 190 440 Z" />
                            </g>
                        </g>

                        <!-- 3. 피부 레이어 (다리, 목, 손) -->
                        <g id="layer-skin-body">
                            <!-- 다리 -->
                            <path class="svg-skin svg-outline" d="M 120 350 L 115 430 L 140 430 L 135 350 Z" />
                            <path class="svg-skin svg-outline" d="M 180 350 L 185 430 L 160 430 L 165 350 Z" />

                            <!-- 양말 -->
                            <path class="svg-white svg-outline-thin" d="M 117 400 L 138 400 L 140 425 L 115 425 Z" />
                            <path class="svg-white svg-outline-thin" d="M 183 400 L 162 400 L 160 425 L 185 425 Z" />
                            <path class="svg-top svg-outline-thin" d="M 117 410 L 139 410 M 183 410 L 161 410" />

                            <!-- 팔 (소매 밖으로 나온 부분) -->
                            <g id="arm-left">
                                <path class="svg-skin svg-outline" d="M 95 285 L 75 350 A 12 12 0 0 0 100 355 L 115 290 Z" />
                            </g>
                            <g id="arm-right">
                                <path class="svg-skin svg-outline" d="M 205 285 L 225 350 A 12 12 0 0 1 200 355 L 185 290 Z" />
                            </g>

                            <!-- 목 -->
                            <path class="svg-skin-dark svg-outline" d="M 135 190 L 165 190 L 160 230 L 140 230 Z" />
                        </g>

                        <!-- 4. 하의 -->
                        <g id="layer-bottom">
                            <g class="part-bottom part-bottom-1">
                                <!-- 카고 반바지 (Haru style) -->
                                <path class="svg-bottom svg-outline" d="M 110 300 C 130 310, 170 310, 190 300 L 195 365 C 180 370, 160 360, 155 350 L 150 315 L 145 350 C 140 360, 120 370, 105 365 Z" />
                                <!-- 주머니 디테일 -->
                                <path class="svg-bottom-dark svg-outline-thin" d="M 108 330 L 125 330 L 125 355 L 105 350 Z" />
                                <path class="svg-bottom-dark svg-outline-thin" d="M 192 330 L 175 330 L 175 355 L 195 350 Z" />
                            </g>
                            <g class="part-bottom part-bottom-2" style="display:none;">
                                <!-- 긴바지 -->
                                <path class="svg-bottom svg-outline" d="M 110 300 C 130 310, 170 310, 190 300 L 195 425 L 160 425 L 150 315 L 140 425 L 105 425 Z" />
                            </g>
                            <g class="part-bottom part-bottom-3" style="display:none;">
                                <!-- 주름 치마 -->
                                <path class="svg-bottom svg-outline" d="M 110 300 C 130 310, 170 310, 190 300 L 210 370 C 180 380, 120 380, 90 370 Z" />
                                <path class="svg-outline-thin" d="M 130 308 L 120 374 M 150 310 L 150 376 M 170 308 L 180 374" fill="none" />
                            </g>
                        </g>

                        <!-- 5. 상의 -->
                        <g id="layer-top">
                            <g class="part-top part-top-1">
                                <!-- 기본 반팔 -->
                                <!-- 소매 -->
                                <path class="svg-top svg-outline" d="M 105 235 L 75 295 L 100 310 L 120 260 Z" />
                                <path class="svg-top svg-outline" d="M 195 235 L 225 295 L 200 310 L 180 260 Z" />
                                <!-- 몸통 -->
                                <path class="svg-top svg-outline" d="M 110 220 C 130 215, 170 215, 190 220 L 190 315 C 160 325, 140 325, 110 315 Z" />
                                <!-- 넥라인 -->
                                <path class="svg-top-dark svg-outline-thin" d="M 135 220 C 145 235, 155 235, 165 220 Z" />
                            </g>

                            <g class="part-top part-top-2" style="display:none;">
                                <!-- 후드티 -->
                                <path class="svg-top svg-outline" d="M 100 235 L 65 315 L 90 325 L 115 260 Z" />
                                <path class="svg-top svg-outline" d="M 200 235 L 235 315 L 210 325 L 185 260 Z" />
                                <path class="svg-top svg-outline" d="M 105 220 C 130 210, 170 210, 195 220 L 195 320 C 160 330, 140 330, 105 320 Z" />
                                <!-- 후드 주머니 -->
                                <path class="svg-top-dark svg-outline" d="M 125 285 L 175 285 L 185 315 L 115 315 Z" />
                                <!-- 후드 끈 -->
                                <path d="M 140 230 L 135 270 M 160 230 L 165 270" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#soft-shadow)" />
                            </g>

                            <g class="part-top part-top-3" style="display:none;">
                                <!-- 조끼 + 셔츠 (Haru Style) -->
                                <!-- 셔츠 소매 -->
                                <path class="svg-top svg-outline" d="M 105 235 L 75 305 L 100 320 L 120 260 Z" />
                                <path class="svg-top svg-outline" d="M 195 235 L 225 305 L 200 320 L 180 260 Z" />
                                <!-- 소매 롤업 디테일 -->
                                <path class="svg-top-dark svg-outline-thin" d="M 80 295 L 105 310 M 220 295 L 195 310" />

                                <!-- 파란 후드 겹쳐입은 베이스 -->
                                <path class="svg-top svg-outline" d="M 110 220 C 130 215, 170 215, 190 220 L 190 315 C 160 325, 140 325, 110 315 Z" />
                                <path class="svg-top-dark svg-outline" d="M 120 215 C 150 240, 180 215, 180 215 Z" />

                                <!-- 갈색 조끼 (고정색상 또는 bottom 색상 활용, 여기선 브라운 톤) -->
                                <path fill="#8b5a2b" class="svg-outline" d="M 115 225 L 130 315 C 150 320, 170 315, 185 225 Z" />
                                <path fill="var(--top)" class="svg-outline-thin" d="M 135 220 L 150 270 L 165 220 Z" /> <!-- 브이넥 -->

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // i18n 설정
            const i18n = {
                ko: {
                    random: "랜덤", tabStyle: "성별 & 얼굴", tabHair: "헤어", tabClothes: "의상", tabColor: "색상",
                    genderLabel: "성별 (기본 비율 및 세트 변경)", boy: "소년 (Boy)", girl: "소녀 (Girl)",
                    eyeLabel: "눈 모양", eye1: "기본", eye2: "웃음", eye3: "도트", eye4: "장난",
                    mouthLabel: "입 모양", mouth1: "미소", mouth2: "활짝", mouth3: "고양이", mouth4: "놀람",
                    hairLabel: "헤어 스타일",
                    hairM1: "더벅머리", hairM2: "댄디컷", hairM3: "스포츠",
                    hairF1: "긴생머리", hairF2: "포니테일", hairF3: "단발머리",
                    topLabel: "상의 (Top)", top1: "반팔티", top2: "후드티", top3: "조끼+가방", top4: "스트라이프",
                    bottomLabel: "하의 (Bottom)", bottom1: "반바지", bottom2: "긴바지", bottom3: "치마",
                    skinLabel: "피부 (Skin Tone)", hairColorLabel: "머리 (Hair Color)",
                    topColorLabel: "상의 (Top Color)", bottomColorLabel: "하의 (Bottom Color)",
                    customColor: "직접 선택"
                },
                en: {
                    random: "Random", tabStyle: "Gender & Face", tabHair: "Hair", tabClothes: "Clothes", tabColor: "Colors",
                    genderLabel: "Gender (Base & Sets)", boy: "Boy", girl: "Girl",
                    eyeLabel: "Eye Shape", eye1: "Basic", eye2: "Smile", eye3: "Dot", eye4: "Squint",
                    mouthLabel: "Mouth Shape", mouth1: "Smile", mouth2: "Laugh", mouth3: "Cat", mouth4: "Surprise",
                    hairLabel: "Hair Style",
                    hairM1: "Spiky", hairM2: "Dandy", hairM3: "Sports",
                    hairF1: "Long", hairF2: "Ponytail", hairF3: "Bob Cut",
                    topLabel: "Top", top1: "T-Shirt", top2: "Hoodie", top3: "Vest+Bag", top4: "Stripe",
                    bottomLabel: "Bottom", bottom1: "Shorts", bottom2: "Pants", bottom3: "Skirt",
                    skinLabel: "Skin Tone", hairColorLabel: "Hair Color",
                    topColorLabel: "Top Color", bottomColorLabel: "Bottom Color",
                    customColor: "Custom"
                }
            };

            let currentLang = localStorage.getItem('lang') || 'ko';

            function updateLanguage(lang) {
                currentLang = lang;
                localStorage.setItem('lang', lang);
                document.documentElement.lang = lang;
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.dataset.i18n;
                    if (i18n[lang][key]) el.textContent = i18n[lang][key];
                });
                const langBtn = document.getElementById('lang-text');
                if (langBtn) langBtn.textContent = lang === 'ko' ? 'EN' : 'KO';

                // 동적으로 렌더링되는 헤어 옵션의 이름도 새로고침
                const hairContainer = document.getElementById('hair-options-container');
                if (hairContainer && hairContainer.innerHTML !== '') renderHairOptions();
            }

            const langToggle = document.getElementById('lang-toggle');
            if (langToggle) {
                langToggle.addEventListener('click', () => {
                    updateLanguage(currentLang === 'ko' ? 'en' : 'ko');
                });
            }

            // 상태 관리
            const state = {
                gender: 'm', // 'm' or 'f'
                eye: 1, mouth: 1, hair: 1, top: 3, bottom: 1, // Haru 메인 스타일 디폴트 (조끼+가방)
                colors: {
                    skin: '#FFE0C2', hair: '#6C4A35', top: '#4a90e2', bottom: '#334155'
                }
            };

            const palettes = {
                skin: ['#FFF0E6', '#FFE0C2', '#F5CBA7', '#E0AC69', '#C68642', '#8D5524'],
                hair: ['#6C4A35', '#2d3436', '#b2bec3', '#d63031', '#fdcb6e', '#0984e3', '#6c5ce7', '#e84393'],
                top: ['#4a90e2', '#e74c3c', '#2ecc71', '#f1c40f', '#9b59b6', '#34495e', '#ecf0f1', '#e67e22'],
                bottom: ['#334155', '#1e293b', '#64748b', '#f8fafc', '#0f172a', '#b91c1c', '#047857', '#1d4ed8']
            };

            const hairOptions = {
                m: [
                    { id: 1, i18nKey: 'hairM1', icon: 'zap' },
                    { id: 2, i18nKey: 'hairM2', icon: 'scissors' },
                    { id: 3, i18nKey: 'hairM3', icon: 'circle-dashed' }
                ],
                f: [
                    { id: 1, i18nKey: 'hairF1', icon: 'arrow-down' },
                    { id: 2, i18nKey: 'hairF2', icon: 'star' },
                    { id: 3, i18nKey: 'hairF3', icon: 'scissors' }
                ]
            };

            // 다크 모드 토글
            const themeToggle = document.getElementById('theme-toggle');
            themeToggle.addEventListener('click', () => {
                const isDark = document.body.classList.toggle('dark-mode');
                document.querySelector('.moon-icon').style.display = isDark ? 'none' : 'block';
                document.querySelector('.sun-icon').style.display = isDark ? 'block' : 'none';
            });

            // 탭 전환
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn, .tab-content').forEach(el => el.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(`${btn.dataset.tab}-content`).classList.add('active');
                });
            });

            // SVG 렌더링 함수
            function updateAvatar() {
                const svg = document.getElementById('avatar-svg');

                // 1. 파츠 토글
                const toggleParts = (prefix, currentId, allowGender = false) => {
                    svg.querySelectorAll(`.part-${prefix}`).forEach(el => el.style.display = 'none');
                    const targetClass = allowGender ? `.part-${prefix}-${state.gender}-${currentId}` : `.part-${prefix}-${currentId}`;
                    svg.querySelectorAll(targetClass).forEach(el => el.style.display = 'block');
                };

                toggleParts('eye', state.eye);
                toggleParts('mouth', state.mouth);
                toggleParts('top', state.top);
                toggleParts('bottom', state.bottom);
                toggleParts('hair', state.hair, true);

                // 2. 색상 변수 업데이트 (그림자 자동 계산)
                const shade = (col, amt) => {
                    let usePound = false;
                    if (col[0] == "#") { col = col.slice(1); usePound = true; }
                    let num = parseInt(col, 16);
                    let r = (num >> 16) + amt; if (r > 255) r = 255; else if (r < 0) r = 0;
                    let b = ((num >> 8) & 0x00FF) + amt; if (b > 255) b = 255; else if (b < 0) b = 0;
                    let g = (num & 0x0000FF) + amt; if (g > 255) g = 255; else if (g < 0) g = 0;
                    return (usePound ? "#" : "") + (g | (b << 8) | (r << 16)).toString(16).padStart(6, '0');
                };

                svg.style.setProperty('--skin-color', state.colors.skin);
                svg.style.setProperty('--skin-dark', shade(state.colors.skin, -30));
                svg.style.setProperty('--hair-color', state.colors.hair);
                svg.style.setProperty('--hair-dark', shade(state.colors.hair, -40));
                svg.style.setProperty('--top-color', state.colors.top);
                svg.style.setProperty('--top-dark', shade(state.colors.top, -40));
                svg.style.setProperty('--bottom-color', state.colors.bottom);
                svg.style.setProperty('--bottom-dark', shade(state.colors.bottom, -30));

                // UI 버튼 동기화
                syncActiveButtons();
            }

            // 헤어 옵션 동적 렌더링
            function renderHairOptions() {
                const container = document.getElementById('hair-options-container');
                if (!container) return;
                container.innerHTML = '';
                hairOptions[state.gender].forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = `style-btn ${state.hair === opt.id ? 'active' : ''}`;
                    btn.dataset.id = opt.id;
                    btn.innerHTML = `<i data-lucide="${opt.icon}"></i> <span>${i18n[currentLang][opt.i18nKey]}</span>`;
                    btn.addEventListener('click', () => {
                        state.hair = opt.id;
                        triggerShake();
                        updateAvatar();
                    });
                    container.appendChild(btn);
                });
                lucide.createIcons();
            }

            // 버튼 클릭 이벤트 바인딩
            document.querySelectorAll('.style-options[data-type]').forEach(group => {
                const type = group.dataset.type;
                if (type === 'hair') return; // 헤어는 동적 렌더링

                group.querySelectorAll('.style-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.dataset.id;
                        if (type === 'gender') {
                            if (state.gender !== id) {
                                state.gender = id;
                                state.hair = 1; // 성별 변경 시 헤어 리셋
                                renderHairOptions();
                            }
                        } else {
                            state[type] = parseInt(id);
                        }
                        triggerShake();
                        updateAvatar();
                    });
                });
            });

            // 팔레트 렌더링
            ['skin', 'hair', 'top', 'bottom'].forEach(part => {
                const cont = document.getElementById(`color-${part}`);
                const picker = document.getElementById(`picker-${part}`);

                palettes[part].forEach(color => {
                    const swatch = document.createElement('div');
                    swatch.className = 'color-swatch';
                    swatch.style.backgroundColor = color;
                    swatch.addEventListener('click', () => {
                        state.colors[part] = color;
                        picker.value = color;
                        updateAvatar();
                        cont.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                        swatch.classList.add('active');
                    });
                    cont.appendChild(swatch);
                });

                picker.addEventListener('input', e => {
                    state.colors[part] = e.target.value;
                    updateAvatar();
                    cont.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                });
            });

            // 버튼 활성 상태 동기화
            function syncActiveButtons() {
                ['gender', 'eye', 'mouth', 'top', 'bottom'].forEach(type => {
                    const group = document.querySelector(`.style-options[data-type="${type}"]`);
                    if (group) {
                        group.querySelectorAll('.style-btn').forEach(btn => {
                            btn.classList.toggle('active', btn.dataset.id == state[type]);
                        });
                    }
                });
            }

            // 애니메이션 효과
            function triggerShake() {
                const body = document.getElementById('full-body');
                body.classList.remove('shake');
                void body.offsetWidth; // reflow
                body.classList.add('shake');
                setTimeout(() => body.classList.remove('shake'), 500);
            }

            // 랜덤 버튼
            document.querySelector('.random').addEventListener('click', () => {
                state.gender = Math.random() > 0.5 ? 'm' : 'f';
                state.eye = Math.floor(Math.random() * 4) + 1;
                state.mouth = Math.floor(Math.random() * 4) + 1;
                state.hair = Math.floor(Math.random() * 3) + 1;
                state.top = Math.floor(Math.random() * 4) + 1;
                state.bottom = Math.floor(Math.random() * 3) + 1;

                ['skin', 'hair', 'top', 'bottom'].forEach(part => {
                    state.colors[part] = palettes[part][Math.floor(Math.random() * palettes[part].length)];
                    document.getElementById(`picker-${part}`).value = state.colors[part];
                });

                renderHairOptions();
                updateAvatar();
                triggerShake();
            });

            // 다운로드 로직
            const triggerDownload = (url, filename) => {
                const a = document.createElement('a');
                a.href = url; a.download = filename;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            };

            document.getElementById('download-svg-btn').addEventListener('click', () => {
                const svg = document.getElementById('avatar-svg').cloneNode(true);
                // SVG 내 CSS 변수 하드코딩 변환 (외부 뷰어 호환성)
                const content = svg.innerHTML
                    .replace(/var\(--skin-color, [^)]+\)/g, state.colors.skin)
                    .replace(/var\(--hair-color, [^)]+\)/g, state.colors.hair)
                    .replace(/var\(--top-color, [^)]+\)/g, state.colors.top)
                    .replace(/var\(--bottom-color, [^)]+\)/g, state.colors.bottom);
                svg.innerHTML = content;

                let src = new XMLSerializer().serializeToString(svg);
                if (!src.match(/^<\?xml/)) src = '<?xml version="1.0" standalone="no"?>\r\n' + src;
                const url = URL.createObjectURL(new Blob([src], { type: 'image/svg+xml;charset=utf-8' }));
                triggerDownload(url, 'avatar_pro.svg');
            });

            document.getElementById('download-png-btn').addEventListener('click', () => {
                const svg = document.getElementById('avatar-svg');
                const src = new XMLSerializer().serializeToString(svg);
                const canvas = document.createElement('canvas');
                canvas.width = 1200; canvas.height = 2000; // 고해상도
                const ctx = canvas.getContext('2d');
                const img = new Image();
                const url = URL.createObjectURL(new Blob([src], { type: 'image/svg+xml;charset=utf-8' }));
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    triggerDownload(canvas.toDataURL('image/png'), 'avatar_pro.png');
                    URL.revokeObjectURL(url);
                };
                img.src = url;
            });

            // 초기화
            updateLanguage(currentLang);
            renderHairOptions();
            updateAvatar();

            // 초기 색상 팔레트 활성화 UI
            ['skin', 'hair', 'top', 'bottom'].forEach(part => {
                const swatch = Array.from(document.getElementById(`color-${part}`).children)
                    .find(el => el.style.backgroundColor === hexToRgb(state.colors[part]));
                if (swatch) swatch.classList.add('active');
            });

            // HEX to RGB 보조함수
            function hexToRgb(hex) {
                var bigint = parseInt(hex.slice(1), 16);
                var r = (bigint >> 16) & 255;
                var g = (bigint >> 8) & 255;
                var b = bigint & 255;
                return `rgb(${r}, ${g}, ${b})`;
            }

        });
    </script>
</body>
</html>
