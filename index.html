<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Avatar Studio Pro | Professional Character Creator</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="app-header">
    <div class="logo-area">
      <i data-lucide="smile"></i>
      <span>Avatar Studio</span>
    </div>
    <div class="header-actions">
      <button class="btn-header random">
        <i data-lucide="shuffle"></i> <span>랜덤</span>
      </button>
      <button id="download-svg-btn" class="btn-header download secondary">
        <i data-lucide="code"></i> <span>SVG</span>
      </button>
      <button id="download-png-btn" class="btn-header download">
        <i data-lucide="download"></i> <span>PNG</span>
      </button>
    </div>
  </header>

  <div class="app-container">
    
    <!-- Left: Preview (50%) -->
    <main class="preview-area">
      <div class="canvas-container">
        <svg id="avatar-svg" viewBox="0 0 250 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="skinShade" cx="50%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#F1C27D" id="skin-stop-1"/>
                <stop offset="70%" stop-color="#E0AC69" id="skin-stop-2"/>
                <stop offset="100%" stop-color="#8D5524" id="skin-stop-3"/>
              </radialGradient>
        
              <linearGradient id="hairShade" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#2d3436" id="hair-stop-1"/>
                <stop offset="50%" stop-color="#3d3d3d" id="hair-stop-2"/>
                <stop offset="100%" stop-color="#1a1a1a" id="hair-stop-3"/>
              </linearGradient>
        
              <linearGradient id="shirtShade" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#4834d4" id="shirt-stop-1"/>
                <stop offset="100%" stop-color="#2c2c54" id="shirt-stop-2"/>
              </linearGradient>
        
              <linearGradient id="pantsShade" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#636e72" id="pants-stop-1"/>
                <stop offset="100%" stop-color="#2d3436" id="pants-stop-2"/>
              </linearGradient>
        
              <linearGradient id="shoeShade" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#000" id="shoe-stop-1"/>
                <stop offset="100%" stop-color="#444" id="shoe-stop-2"/>
              </linearGradient>
        
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.1)"/>
              </filter>
            </defs>
        
            <!-- Character SVG Body -->
            <g transform="scale(0.8) translate(30,120)">
              <ellipse cx="125" cy="120" rx="60" ry="80" fill="url(#skinShade)" filter="url(#shadow)"/>
              <g id="hair-styles">
                <path id="hair-style-1" d="M65,90 Q125,20 185,90 Q170,30 125,30 Q80,30 65,90" fill="url(#hairShade)" filter="url(#shadow)"/>
                <path id="hair-style-2" d="M60,80 Q125,-10 190,80 L195,180 Q195,200 175,200 L160,200 Q140,200 125,180 Q110,200 90,200 L75,200 Q55,200 55,180 Z" fill="url(#hairShade)" filter="url(#shadow)" style="display:none;"/>
                <path id="hair-style-3" d="M65,90 L50,70 L80,75 L90,40 L120,70 L135,30 L160,75 L190,50 L185,90 Q170,30 125,30 Q80,30 65,90" fill="url(#hairShade)" filter="url(#shadow)" style="display:none;"/>
                <path id="hair-style-4" d="M80,50 Q125,20 170,50 Q160,40 125,40 Q90,40 80,50" fill="url(#hairShade)" filter="url(#shadow)" style="display:none;"/>
              </g>
              <g id="eye-styles">
                 <g id="eye-style-1">
                    <ellipse cx="100" cy="110" rx="12" ry="8" fill="white"/>
                    <circle cx="100" cy="110" r="5" fill="#333"/>
                    <ellipse cx="150" cy="110" rx="12" ry="8" fill="white"/>
                    <circle cx="150" cy="110" r="5" fill="#333"/>
                 </g>
                 <g id="eye-style-2" style="display:none;">
                    <rect x="88" y="105" width="24" height="12" rx="4" fill="white"/>
                    <rect x="94" y="105" width="12" height="12" fill="#333"/>
                    <rect x="138" y="105" width="24" height="12" rx="4" fill="white"/>
                    <rect x="144" y="105" width="12" height="12" fill="#333"/>
                 </g>
                 <g id="eye-style-3" style="display:none;">
                    <circle cx="100" cy="110" r="6" fill="#333"/>
                    <circle cx="150" cy="110" r="6" fill="#333"/>
                 </g>
              </g>
              <path d="M125,120 Q128,135 125,140" stroke="#654321" stroke-width="2" fill="none"/>
              <g id="mouth-styles">
                <path id="mouth-style-1" d="M110,155 Q125,165 140,155" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path id="mouth-style-2" d="M115,160 Q125,160 135,160" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round" style="display:none;"/>
                <circle id="mouth-style-3" cx="125" cy="160" r="6" fill="#333" style="display:none;"/>
              </g>
            </g>
            <rect x="65" y="260" width="120" height="200" rx="40" ry="0" fill="url(#shirtShade)" filter="url(#shadow)"/>
            <rect x="35" y="260" width="30" height="200" rx="20" ry="20" fill="url(#skinShade)" filter="url(#shadow)"/>
            <rect x="35" y="460" width="20" height="30" rx="5" fill="url(#skinShade)" filter="url(#shadow)"/> 
            <rect x="55" y="465" width="8" height="20" rx="4" fill="url(#skinShade)" filter="url(#shadow)"/>
            <rect x="185" y="260" width="30" height="200" rx="20" ry="20" fill="url(#skinShade)" filter="url(#shadow)"/>
            <rect x="195" y="460" width="20" height="30" rx="5" fill="url(#skinShade)" filter="url(#shadow)"/> 
            <rect x="187" y="465" width="8" height="20" rx="4" fill="url(#skinShade)" filter="url(#shadow)"/>
            <rect x="65" y="460" width="50" height="200" rx="0" ry="0" fill="url(#pantsShade)" filter="url(#shadow)"/>
            <rect x="135" y="460" width="50" height="200" rx="0" ry="0" fill="url(#pantsShade)" filter="url(#shadow)"/>
            <rect x="60" y="660" width="60" height="30" rx="10" ry="10" fill="url(#shoeShade)" filter="url(#shadow)"/>
            <rect x="130" y="660" width="60" height="30" rx="10" ry="10" fill="url(#shoeShade)" filter="url(#shadow)"/>
          </svg>
      </div>
    </main>

    <!-- Right: Controls (50%) -->
    <aside class="controls-panel">
      <nav class="panel-tabs">
        <button class="tab-btn active" data-tab="face">얼굴</button>
        <button class="tab-btn" data-tab="hair">헤어</button>
        <button class="tab-btn" data-tab="skin">피부색</button>
        <button class="tab-btn" data-tab="clothes">옷 & 신발</button>
      </nav>

      <div class="controls-scroll">
        <!-- Face Tab -->
        <div id="face-content" class="tab-content active">
          <div class="control-group">
            <label>눈 모양</label>
            <div class="style-options" data-type="eye">
               <button class="style-btn active" data-id="1"><i data-lucide="eye"></i> <span>기본</span></button>
               <button class="style-btn" data-id="2"><i data-lucide="square"></i> <span>스퀘어</span></button>
               <button class="style-btn" data-id="3"><i data-lucide="circle"></i> <span>도트</span></button>
            </div>
          </div>
          <div class="control-group">
            <label>입 모양</label>
            <div class="style-options" data-type="mouth">
               <button class="style-btn active" data-id="1"><i data-lucide="smile"></i> <span>미소</span></button>
               <button class="style-btn" data-id="2"><i data-lucide="meh"></i> <span>무표정</span></button>
               <button class="style-btn" data-id="3"><i data-lucide="circle"></i> <span>놀람</span></button>
            </div>
          </div>
        </div>

        <!-- Hair Tab -->
        <div id="hair-content" class="tab-content">
          <div class="control-group">
            <label>헤어 스타일</label>
            <div class="style-options" data-type="hair">
               <button class="style-btn active" data-id="1"><i data-lucide="user"></i> <span>기본</span></button>
               <button class="style-btn" data-id="2"><i data-lucide="star"></i> <span>클래식</span></button>
               <button class="style-btn" data-id="3"><i data-lucide="zap"></i> <span>스파이키</span></button>
               <button class="style-btn" data-id="4"><i data-lucide="scissors"></i> <span>숏컷</span></button>
            </div>
          </div>
          <div class="control-group">
            <label>머리 색상</label>
            <div class="color-options" id="hair-options"></div>
            <input type="color" id="hair-color-picker" value="#2d3436">
          </div>
        </div>

        <!-- Skin Tone Tab -->
        <div id="skin-content" class="tab-content">
          <div class="control-group">
            <label>피부색 선택</label>
            <div class="color-options" id="skin-options"></div>
            <input type="color" id="skin-color-picker" value="#F1C27D">
          </div>
        </div>

        <!-- Clothes & Shoes Tab -->
        <div id="clothes-content" class="tab-content">
          <div class="control-group">
            <label>상의 색상</label>
            <div class="color-options" id="shirt-options"></div>
            <input type="color" id="shirt-color-picker" value="#4834d4">
          </div>
          <div class="control-group">
            <label>하의 색상</label>
            <div class="color-options" id="pants-options"></div>
            <input type="color" id="pants-color-picker" value="#636e72">
          </div>
        </div>
      </div>
    </aside>

  </div>
  <script src="main.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
